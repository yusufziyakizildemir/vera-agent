<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#02050d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>V.E.R.A. // J.A.R.V.I.S.</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- Minimal Password Gate (Only shown once until token saved in localStorage) -->
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="minimal-login">
      <div class="core-ring-small"></div>
      <input id="login-password" type="password" placeholder="J.A.R.V.I.S. Erişim Parolası" required autocomplete="current-password" />
      <div id="login-error" class="error-text"></div>
    </form>
  </div>

  <!-- Pure Full-Screen Voice-Only J.A.R.V.I.S. Core (Zero Buttons / Zero Clutter) -->
  <div id="app-shell" class="pure-voice-screen hidden">
    <div id="reactor-core" class="reactor-core">
      <div class="ring ring-outer"></div>
      <div class="ring ring-mid"></div>
      <div class="ring ring-inner"></div>
      <div class="core-eye"></div>
    </div>

    <div class="voice-hud-caption">
      <div id="jarvis-state" class="jarvis-state">SİSTEM HAZIR — SESLİ KOMUT BEKLENİYOR</div>
      <div id="jarvis-heard" class="jarvis-heard"></div>
      <div id="jarvis-reply" class="jarvis-reply"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
