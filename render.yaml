services:
  - type: web
    name: vera-agent
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/ping
    envVars:
      - key: AGENT_NAME
        value: VERA
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: LANGUAGE
        value: tr
      - key: TTS_VOICE
        value: tr-TR-EmelNeural
      - key: TTS_REPLY_TO_VOICE
        value: "true"
      - key: GEMINI_FAST_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_SMART_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-flash
      - key: ENABLE_PLAYWRIGHT
        value: "false"
      - key: DREAM_SCHEDULE_TIME
        value: "03:30"
      - key: MORNING_BRIEFING_TIME
        value: "08:30"
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_BACKUP_REPO
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
